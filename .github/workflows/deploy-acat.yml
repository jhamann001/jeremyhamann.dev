# Deploys the Transfer Tracker demo to transfers.jeremyhamann.dev: tests, migrates the database, resets the
# demo data, then deploys the Worker and builds and rolls out the app's container. Runs only when someone
# presses "Run workflow" on main.
name: Deploy Transfer Tracker

on:
  workflow_dispatch:
    inputs:
      rebuild_database:
        description: Rebuild the database from the migrations first (only after a migration was rewritten; the reset step refills the demo data)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-acat
  cancel-in-progress: false

jobs:
  guard:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/guard.yml
    secrets:
      NAME_DENYLIST: ${{ secrets.NAME_DENYLIST }}

  deploy:
    name: Test, migrate, reset and deploy
    needs: guard
    runs-on: ubuntu-24.04
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Require a green CI run on this commit (it runs the database tests and starts the image)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only main's runs: one after another they have run every app's jobs on its current code. A branch run on
          # this commit counted only that branch's changes (tools/ci/changed-apps.mjs).
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --commit "$GITHUB_SHA" \
            --status completed --json conclusion --jq '.[0].conclusion // ""')
          if [ "$conclusion" != "success" ]; then
            echo "CI has not passed on $GITHUB_SHA (latest completed run: ${conclusion:-none})." >&2
            exit 1
          fi
          echo "CI passed on $GITHUB_SHA."
      - run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck -w transfer-tracker
          npm test -w transfer-tracker

      - name: Rebuild the database from the migrations (only when asked; it drops every table, and the reset step refills them)
        if: inputs.rebuild_database
        working-directory: apps/acat
        env:
          ACAT_DATABASE_URL: ${{ secrets.ACAT_DATABASE_URL }}
        run: |
          echo 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;' \
            | DATABASE_URL="${ACAT_DATABASE_URL/-pooler./.}" npx prisma db execute --stdin --schema prisma/schema.prisma

      - name: Apply database migrations (over the direct host; the connection pooler can't run them)
        working-directory: apps/acat
        env:
          ACAT_DATABASE_URL: ${{ secrets.ACAT_DATABASE_URL }}
        run: DATABASE_URL="${ACAT_DATABASE_URL/-pooler./.}" npx prisma migrate deploy

      - name: Load the demo settings (no secrets; the same ones the Worker hands the container)
        run: |
          node -e "
            for (const [k, v] of Object.entries(require('./apps/acat/demo-config.json'))) {
              if (!/^[A-Z][A-Z0-9_]*$/.test(k) || !/^[A-Za-z0-9_.:/@-]*$/.test(String(v))) {
                console.error('demo-config.json: refusing an unexpected key or value: ' + k);
                process.exit(1);
              }
              console.log(k + '=' + v);
            }" >> "$GITHUB_ENV"

      - name: Reset the demo data (seed, directory sync, digest into the Outbox)
        env:
          ACAT_DATABASE_URL: ${{ secrets.ACAT_DATABASE_URL }}
        run: DATABASE_URL="$ACAT_DATABASE_URL" DEMO_SEED=reset npm run demo:reset -w transfer-tracker

      - name: Build the app image (so the deploy's own build below comes from this cache)
        run: docker build -f apps/acat/Dockerfile --platform linux/amd64 -t transfers-demo:prebuilt .

      - name: Copy the app's built static files out of the image, for Cloudflare to serve without the container
        run: |
          rm -rf apps/acat/worker/static/_next/static
          mkdir -p apps/acat/worker/static/_next
          id=$(docker create transfers-demo:prebuilt)
          docker cp "$id:/app/apps/acat/.next/static" apps/acat/worker/static/_next/static
          docker rm "$id" > /dev/null
          echo "$(find apps/acat/worker/static/_next/static -type f | wc -l) files"
          test -n "$(find apps/acat/worker/static/_next/static -name '*.js' -print -quit)"

      - name: Deploy the Worker and the app container
        id: deploy
        working-directory: apps/acat/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACAT_DATABASE_URL: ${{ secrets.ACAT_DATABASE_URL }}
          ACAT_AUTH_SECRET: ${{ secrets.ACAT_AUTH_SECRET }}
          ACAT_RESET_TOKEN: ${{ secrets.ACAT_RESET_TOKEN }}
        run: |
          umask 077
          secrets_file="$RUNNER_TEMP/acat-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node -e "require('fs').writeFileSync(process.argv[1], JSON.stringify({
            DATABASE_URL: process.env.ACAT_DATABASE_URL,
            AUTH_SECRET: process.env.ACAT_AUTH_SECRET,
            DEMO_RESET_TOKEN: process.env.ACAT_RESET_TOKEN,
          }))" "$secrets_file"
          set -o pipefail
          npx wrangler deploy --secrets-file "$secrets_file" --containers-rollout immediate | tee "$RUNNER_TEMP/wrangler-deploy.log"
          # The version this deploy made: the key to its own readiness check (apps/demo-edge/wait-for-deploy.mjs).
          version=$(tr -d '\r' < "$RUNNER_TEMP/wrangler-deploy.log" | sed -n 's/^Current Version ID: \([0-9a-f-]\{36\}\)$/\1/p' | tail -n 1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Wait for this deploy's own container (Cloudflare stops the old one first, so for a minute or two there is none)
        env:
          VERSION: ${{ steps.deploy.outputs.version }}
        run: node apps/demo-edge/wait-for-deploy.mjs https://transfers.jeremyhamann.dev "$VERSION" /login

      - name: Check the live app answers
        run: |
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://transfers.jeremyhamann.dev/api/health || true)
            if [ "$code" = "200" ]; then
              echo "Live: /api/health answered 200 (attempt $attempt)"
              login=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://transfers.jeremyhamann.dev/login)
              echo "The sign-in page answered $login"
              [ "$login" = "200" ] && exit 0
            fi
            echo "Attempt $attempt: $code"; sleep 10
          done
          echo "The app did not answer within five minutes." >&2
          exit 1
