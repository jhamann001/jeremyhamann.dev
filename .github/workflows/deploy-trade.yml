# Deploys the Trade Request demo to trade.jeremyhamann.dev: tests, migrates the database, resets the demo
# data, then deploys the Worker and builds and rolls out the app's container. Runs only when someone
# presses "Run workflow" on main.
name: Deploy Trade Request

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-trade
  cancel-in-progress: false

jobs:
  guard:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/guard.yml
    secrets:
      NAME_DENYLIST: ${{ secrets.NAME_DENYLIST }}

  deploy:
    name: Test, migrate, reset and deploy
    needs: guard
    runs-on: ubuntu-24.04
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck -w trade-request
          npm test -w trade-request

      - name: Apply database migrations (over the direct host; the connection pooler can't run them)
        env:
          TRADE_DATABASE_URL: ${{ secrets.TRADE_DATABASE_URL }}
        run: DATABASE_URL="${TRADE_DATABASE_URL/-pooler./.}" npm run migrate -w @trade-request/server

      - name: Load the demo settings (no secrets; the same ones the Worker hands the container)
        run: |
          node -e "
            for (const [k, v] of Object.entries(require('./apps/trade/demo-config.json'))) {
              if (!/^[A-Z][A-Z0-9_]*$/.test(k) || !/^[A-Za-z0-9_.:/@-]*$/.test(String(v))) {
                console.error('demo-config.json: refusing an unexpected key or value: ' + k);
                process.exit(1);
              }
              console.log(k + '=' + v);
            }" >> "$GITHUB_ENV"

      - name: Reset the demo data (seed, drift history, outbox)
        env:
          TRADE_DATABASE_URL: ${{ secrets.TRADE_DATABASE_URL }}
        run: DATABASE_URL="$TRADE_DATABASE_URL" npm run seed:demo -w @trade-request/server

      - name: Build the app image (so the deploy's own build below comes from this cache)
        run: docker build -f apps/trade/Dockerfile --platform linux/amd64 -t trade-demo:prebuilt .

      - name: Copy the client's built files out of the image, for Cloudflare to serve without the container
        run: |
          rm -rf apps/trade/worker/static/assets
          mkdir -p apps/trade/worker/static
          id=$(docker create trade-demo:prebuilt)
          docker cp "$id:/app/apps/trade/client/dist/assets" apps/trade/worker/static/assets
          docker rm "$id" > /dev/null
          echo "$(find apps/trade/worker/static/assets -type f | wc -l) files"
          test -n "$(find apps/trade/worker/static/assets -name '*.js' -print -quit)"

      - name: Deploy the Worker and the app container
        working-directory: apps/trade/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TRADE_DATABASE_URL: ${{ secrets.TRADE_DATABASE_URL }}
          TRADE_SESSION_SECRET: ${{ secrets.TRADE_SESSION_SECRET }}
          TRADE_RESET_TOKEN: ${{ secrets.TRADE_RESET_TOKEN }}
        run: |
          umask 077
          secrets_file="$RUNNER_TEMP/trade-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node -e "require('fs').writeFileSync(process.argv[1], JSON.stringify({
            DATABASE_URL: process.env.TRADE_DATABASE_URL,
            SESSION_SECRET: process.env.TRADE_SESSION_SECRET,
            DEMO_RESET_TOKEN: process.env.TRADE_RESET_TOKEN,
          }))" "$secrets_file"
          npx wrangler deploy --secrets-file "$secrets_file" --containers-rollout immediate

      - name: Check the live app answers (the first request starts the container)
        run: |
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://trade.jeremyhamann.dev/api/health || true)
            if [ "$code" = "200" ]; then echo "Live: /api/health answered 200 (attempt $attempt)"; exit 0; fi
            echo "Attempt $attempt: $code"; sleep 10
          done
          echo "The app did not answer within five minutes." >&2
          exit 1
