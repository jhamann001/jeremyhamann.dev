# Resets the advisor platform demo every night at 07:00 UTC, like the other demos: empties the database as its owner
# and seeds it again, so every date is relative to the new day (apps/aoa/scripts/demo-seed.ts, DEMO_SEED=reset).
# The audit trail refuses UPDATE and DELETE even to the app, so the reset runs here as the owner, whose login the
# container never gets. Meanwhile the Worker shows visitors its "resetting" page, which comes down when the seed is
# in (or by itself, if the reset fails). GitHub starts this repository's scheduled runs hours late (07:00 ran at 16:45
# on 2026-11-02), so the Worker's 07:00 cron starts this workflow instead (apps/demo-edge/reset-dispatch.js), and the
# schedule below is only the fallback.
#
# It resets with the code the demo was last deployed from, not main's newest: a seed change or a migration merged but
# not yet deployed would fail against the deployed schema after the data was already gone. The seed script checks the
# rest before it empties anything (the migrations, the logins, the resetting page) and leaves the data alone if any
# check fails.
name: Reset the advisor platform demo

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read # the fallback's check for a reset that already ran, and the last deploy's commit

# The deploy runs the same reset; never both at once.
concurrency:
  group: aoa-database
  cancel-in-progress: false

jobs:
  reset:
    name: Reset the demo data
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/aoa
    steps:
      # The Worker's cron starts this workflow on time; this schedule is the fallback, and GitHub starts it hours
      # late. It skips itself when a reset already ran in the last 20 hours.
      - name: Skip a late scheduled run when today's reset already ran
        id: due
        if: github.event_name == 'schedule'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          done=$(gh run list -R "$GITHUB_REPOSITORY" --workflow reset-aoa.yml --status success --created ">=$since" --json databaseId --jq length)
          echo "Successful resets since $since: $done"
          if [ "$done" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - name: Find the commit the demo was last deployed from
        id: deployed
        if: steps.due.outputs.skip != 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy-aoa.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "No successful deploy of the demo from main, so there is no code to reset with. The database is untouched." >&2
            exit 1
          fi
          echo "Resetting with the last deployed commit, $sha (main is at $GITHUB_SHA)."
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.due.outputs.skip != 'true'
        with:
          ref: ${{ steps.deployed.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.due.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/aoa/package-lock.json
      - run: npm ci
        if: steps.due.outputs.skip != 'true'
      - name: Reset (one retry a minute later; the first query also wakes the database)
        if: steps.due.outputs.skip != 'true'
        env:
          AOA_DATABASE_URL: ${{ secrets.AOA_DATABASE_URL }}
          DEMO_RESET_GATE_URL: https://aoa.jeremyhamann.dev/__demo/reset-gate
        run: |
          owner=$(npm run -s demo:owner-url)
          echo "::add-mask::$owner"
          export DIRECT_DATABASE_URL="$owner" DEMO_SEED=reset
          # Exit 3: the demo is reset but its resetting page didn't come down (it does by itself within 20 minutes).
          # Resetting again wouldn't fix that, so only other failures get the retry.
          status=0; npm run demo:reset || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            echo "Reset failed; retrying in 60 s."; sleep 60
            status=0; npm run demo:reset || status=$?
          fi
          exit "$status"
