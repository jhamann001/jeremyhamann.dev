# Deploys the portfolio site to Cloudflare. Runs only when someone presses "Run workflow" on main.
name: Deploy site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  guard:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/guard.yml
    secrets:
      NAME_DENYLIST: ${{ secrets.NAME_DENYLIST }}

  deploy:
    name: Build and deploy
    needs: guard
    runs-on: ubuntu-24.04
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -w synthetic
      - run: npm run build -w site
      - name: Deploy to Cloudflare
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
