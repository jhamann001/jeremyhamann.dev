# Deploys the Statement Analyzer demo to statements.jeremyhamann.dev: tests, builds the app's image, brings the
# database's schema up to date and resets the demo data, then deploys the Worker and rolls out the container. A
# failed test or build leaves the live site and its data as they were; the reset runs only once the image is built.
# Runs only when someone presses "Run workflow" on main.
name: Deploy Statement Analyzer

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-statements
  cancel-in-progress: false

jobs:
  guard:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/guard.yml
    secrets:
      NAME_DENYLIST: ${{ secrets.NAME_DENYLIST }}

  deploy:
    name: Test, reset and deploy
    needs: guard
    runs-on: ubuntu-24.04
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/statements/requirements.txt

      - name: Require a green CI run on this commit (it runs the database tests and starts the image)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only main's runs: one after another they have run every app's jobs on its current code. A branch run on
          # this commit counted only that branch's changes (tools/ci/changed-apps.mjs).
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --commit "$GITHUB_SHA" \
            --status completed --json conclusion --jq '.[0].conclusion // ""')
          if [ "$conclusion" != "success" ]; then
            echo "CI has not passed on $GITHUB_SHA (latest completed run: ${conclusion:-none})." >&2
            exit 1
          fi
          echo "CI passed on $GITHUB_SHA."

      - name: Install
        run: |
          npm ci
          pip install -r apps/statements/requirements.txt pytest==9.2.0

      - name: Test (the database tests skip here; CI ran them against a throwaway Postgres)
        run: |
          npm test -w statement-analyzer
          npm test -w @statement-analyzer/worker
          cd apps/statements && python -m pytest -q -p no:cacheprovider

      - name: Load the demo settings (no secrets; the same ones the Worker hands the container)
        run: |
          node -e "
            for (const [k, v] of Object.entries(require('./apps/statements/demo-config.json'))) {
              if (!/^[A-Z][A-Z0-9_]*$/.test(k) || !/^[A-Za-z0-9_.:/@-]*$/.test(String(v))) {
                console.error('demo-config.json: refusing an unexpected key or value: ' + k);
                process.exit(1);
              }
              console.log(k + '=' + v);
            }" >> "$GITHUB_ENV"

      - name: Build the app image (so the deploy's own build below comes from this cache)
        run: docker build -f apps/statements/Dockerfile --platform linux/amd64 -t statements-demo:prebuilt .

      - name: Copy the app's built scripts and styles out of the image, for Cloudflare to serve without the container
        run: |
          rm -rf apps/statements/worker/static/assets
          id=$(docker create statements-demo:prebuilt)
          docker cp "$id:/app/static/assets" apps/statements/worker/static/assets
          docker rm "$id" > /dev/null
          echo "$(find apps/statements/worker/static/assets -type f | wc -l) files"
          test -n "$(find apps/statements/worker/static/assets -name '*.js' -print -quit)"

      - name: Bring the schema up to date (over the direct host) and reset the demo data (one transaction)
        working-directory: apps/statements
        env:
          STATEMENTS_DATABASE_URL: ${{ secrets.STATEMENTS_DATABASE_URL }}
        run: DATABASE_URL="$STATEMENTS_DATABASE_URL" python demo_reset.py

      - name: Deploy the Worker and the app container
        working-directory: apps/statements/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STATEMENTS_DATABASE_URL: ${{ secrets.STATEMENTS_DATABASE_URL }}
          STATEMENTS_SESSION_SECRET: ${{ secrets.STATEMENTS_SESSION_SECRET }}
        run: |
          umask 077
          secrets_file="$RUNNER_TEMP/statements-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          # The reset token and the visitor-pseudonym key are new for each deploy: only this Worker and the container
          # it starts use them, and the Worker retires a container started with the previous ones.
          node -e "
            const fresh = () => require('crypto').randomBytes(32).toString('hex');
            require('fs').writeFileSync(process.argv[1], JSON.stringify({
              DATABASE_URL: process.env.STATEMENTS_DATABASE_URL,
              SESSION_SECRET: process.env.STATEMENTS_SESSION_SECRET,
              DEMO_RESET_TOKEN: fresh(),
              VISITOR_HASH_KEY: fresh(),
            }))" "$secrets_file"
          npx wrangler deploy --secrets-file "$secrets_file" --containers-rollout immediate

      - name: Check the live app answers (the first request starts the container) and keeps its private routes private
        run: |
          site=https://statements.jeremyhamann.dev
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$site/api/health" || true)
            if [ "$code" = "200" ]; then
              echo "Live: /api/health answered 200 (attempt $attempt)"
              curl -sf --max-time 20 -D "$RUNNER_TEMP/page-headers" -o "$RUNNER_TEMP/page.html" "$site/"
              grep -q "<title>Statement Analyzer</title>" "$RUNNER_TEMP/page.html"
              grep -qi "^content-security-policy: default-src 'self'" "$RUNNER_TEMP/page-headers"
              echo "The page loads, under its Content-Security-Policy."
              for path in /api/internal/demo-reset /api/scan /api/v1/households /mcp /docs; do
                private=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X POST -H 'content-length: 0' "$site$path")
                echo "POST $path answered $private"
                [ "$private" = "404" ] || exit 1
              done
              exit 0
            fi
            echo "Attempt $attempt: $code"; sleep 10
          done
          echo "The app did not answer within five minutes." >&2
          exit 1
