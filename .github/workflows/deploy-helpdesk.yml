# Deploys the WM Help Desk demo to helpdesk.jeremyhamann.dev: tests, migrates the database, grants the app role,
# resets the demo data and builds the app's image; only then gives the app role a password this run generates and
# deploys the Worker and rolls out the container. The running container still holds the old password, so
# everything that can fail runs before the password changes: a failed run leaves the live site as it was.
# Runs only when someone presses "Run workflow" on main.
name: Deploy WM Help Desk

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# The daily reset touches the same database; never both at once.
concurrency:
  group: helpdesk-database
  cancel-in-progress: false

jobs:
  guard:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/guard.yml
    secrets:
      NAME_DENYLIST: ${{ secrets.NAME_DENYLIST }}

  deploy:
    name: Test, migrate, reset and deploy
    needs: guard
    runs-on: ubuntu-24.04
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/helpdesk/package-lock.json
      - name: Require a green CI run on this commit (it runs the database tests and starts the image)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only main's runs: one after another they have run every app's jobs on its current code. A branch run on
          # this commit counted only that branch's changes (tools/ci/changed-apps.mjs).
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --commit "$GITHUB_SHA" \
            --status completed --json conclusion --jq '.[0].conclusion // ""')
          if [ "$conclusion" != "success" ]; then
            echo "CI has not passed on $GITHUB_SHA (latest completed run: ${conclusion:-none})." >&2
            exit 1
          fi
          echo "CI passed on $GITHUB_SHA."

      - name: Install (the Worker from the repository root, the app on its own)
        run: |
          npm ci
          cd apps/helpdesk && npm ci && npx prisma generate

      - name: Typecheck and test
        working-directory: apps/helpdesk
        run: |
          npm run typecheck
          npm test

      - name: Apply database migrations (over the direct host; the connection pooler can't run them)
        working-directory: apps/helpdesk
        env:
          HELPDESK_DATABASE_URL: ${{ secrets.HELPDESK_DATABASE_URL }}
        run: DATABASE_URL="${HELPDESK_DATABASE_URL/-pooler./.}" npx prisma migrate deploy

      - name: Grant the app role (its password stays as it is until the Worker deploys)
        working-directory: apps/helpdesk
        env:
          HELPDESK_DATABASE_URL: ${{ secrets.HELPDESK_DATABASE_URL }}
        run: |
          direct="${HELPDESK_DATABASE_URL/-pooler./.}"
          dbname=$(node -e "process.stdout.write(new URL(process.argv[1]).pathname.slice(1))" "$direct")
          psql "$direct" -v ON_ERROR_STOP=1 -v dbname="$dbname" -q -f prisma/sql/runtime-roles.sql

      - name: Load the demo settings (no secrets; the same ones the Worker hands the container)
        working-directory: apps/helpdesk
        run: node scripts/demo-env.mjs >> "$GITHUB_ENV"

      - name: Reset the demo data (one transaction as the owner, then seven jobs once)
        working-directory: apps/helpdesk
        env:
          HELPDESK_DATABASE_URL: ${{ secrets.HELPDESK_DATABASE_URL }}
        run: DATABASE_URL="$HELPDESK_DATABASE_URL" DEMO_SEED=reset npm run demo:reset

      - name: Build the app image (so the deploy's own build below comes from this cache)
        run: docker build -f apps/helpdesk/Dockerfile --platform linux/amd64 -t helpdesk-demo:prebuilt .

      - name: Copy the app's built static files out of the image, for Cloudflare to serve without the container
        run: |
          rm -rf apps/helpdesk/worker/static/_next/static
          mkdir -p apps/helpdesk/worker/static/_next
          id=$(docker create helpdesk-demo:prebuilt)
          docker cp "$id:/app/.next/static" apps/helpdesk/worker/static/_next/static
          docker rm "$id" > /dev/null
          echo "$(find apps/helpdesk/worker/static/_next/static -type f | wc -l) files"
          test -n "$(find apps/helpdesk/worker/static/_next/static -name '*.js' -print -quit)"

      - name: Give the app role a fresh password, then deploy the Worker and the app container
        id: deploy
        working-directory: apps/helpdesk/worker
        env:
          HELPDESK_DATABASE_URL: ${{ secrets.HELPDESK_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HELPDESK_AUTH_SECRET: ${{ secrets.HELPDESK_AUTH_SECRET }}
          # Optional: the daily cron's key to start the reset workflow (apps/demo-edge/reset-dispatch.js).
          RESET_DISPATCH_TOKEN: ${{ secrets.RESET_DISPATCH_TOKEN }}
        run: |
          umask 077
          secrets_file="$RUNNER_TEMP/helpdesk-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          direct="${HELPDESK_DATABASE_URL/-pooler./.}"
          # Neon's rules: about 60 bits of entropy at least, and no character three times in a row.
          password=$(node -e "
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
            let out = '';
            for (const byte of require('crypto').randomBytes(128)) {
              const c = chars[byte % chars.length];
              if (out.length >= 2 && out.at(-1) === c && out.at(-2) === c) continue;
              out += c;
              if (out.length === 40) break;
            }
            process.stdout.write(out);")
          echo "::add-mask::$password"
          PASSWORD="$password" node -e "
            const u = new URL(process.env.HELPDESK_DATABASE_URL);
            u.username = 'wm_helpdesk_app';
            u.password = process.env.PASSWORD;
            require('fs').writeFileSync(process.argv[1], JSON.stringify({
              DATABASE_URL: u.toString(),
              AUTH_SECRET: process.env.HELPDESK_AUTH_SECRET,
              REPLY_TOKEN_SECRET: require('crypto').randomBytes(32).toString('hex'),
              VISITOR_HASH_KEY: require('crypto').randomBytes(32).toString('hex'),
              ...(process.env.RESET_DISPATCH_TOKEN ? { RESET_DISPATCH_TOKEN: process.env.RESET_DISPATCH_TOKEN } : {}),
            }))" "$secrets_file"
          # From here the running container's password no longer works, until the new Worker replaces it.
          psql "$direct" -v ON_ERROR_STOP=1 -q -c "ALTER ROLE wm_helpdesk_app PASSWORD '$password'"
          set -o pipefail
          npx wrangler deploy --secrets-file "$secrets_file" --containers-rollout immediate | tee "$RUNNER_TEMP/wrangler-deploy.log"
          # The version this deploy made: the key to its own readiness check (apps/demo-edge/wait-for-deploy.mjs).
          version=$(tr -d '\r' < "$RUNNER_TEMP/wrangler-deploy.log" | sed -n 's/^Current Version ID: \([0-9a-f-]\{36\}\)$/\1/p' | tail -n 1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Wait for this deploy's own container (Cloudflare stops the old one first, so for a minute or two there is none)
        env:
          VERSION: ${{ steps.deploy.outputs.version }}
        run: node apps/demo-edge/wait-for-deploy.mjs https://helpdesk.jeremyhamann.dev "$VERSION" /sign-in

      - name: Check the live app answers
        run: |
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://helpdesk.jeremyhamann.dev/api/health || true)
            if [ "$code" = "200" ]; then
              echo "Live: /api/health answered 200 (attempt $attempt)"
              signin=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://helpdesk.jeremyhamann.dev/sign-in)
              echo "The sign-in page answered $signin"
              [ "$signin" = "200" ] && exit 0
            fi
            echo "Attempt $attempt: $code"; sleep 10
          done
          echo "The app did not answer in 30 attempts." >&2
          exit 1
