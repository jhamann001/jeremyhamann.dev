<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, nocache" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <title>Offline — WM Help Desk</title>
    <!--
      Served by the service worker when a NAVIGATION cannot reach the network (public/sw.js).

      It is deliberately self-contained: no stylesheet, no script, no font and no image request, because
      every one of those would be a second thing to fail on a connection that has already failed. It
      carries NO ticket data of any kind — this file is a static asset in a device cache, which is
      exactly the place this design refuses to put client records.

      Styling mirrors docs/MOBILE_FIRST.md by hand: 16 px body text, a >= 44 px tap target, safe-area
      padding, and the app's own neutral tokens in both colour schemes.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #0a0a0a;
        --muted: #737373;
        --border: #e5e5e5;
        --card: #fafafa;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --fg: #fafafa;
          --muted: #a1a1a1;
          --border: #262626;
          --card: #171717;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
      }
      body {
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1rem, env(safe-area-inset-top, 0px)) max(1rem, env(safe-area-inset-right, 0px))
          max(1rem, env(safe-area-inset-bottom, 0px)) max(1rem, env(safe-area-inset-left, 0px));
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 26rem;
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        background: var(--card);
        padding: 1.25rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        line-height: 1.3;
      }
      p {
        margin: 0 0 0.75rem;
        color: var(--muted);
      }
      p:last-of-type {
        margin-bottom: 1rem;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 44px;
        padding: 0 1rem;
        font: inherit;
        font-size: 16px;
        font-weight: 500;
        color: var(--bg);
        background: var(--fg);
        border: 0;
        border-radius: 0.5rem;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--muted);
        outline-offset: 2px;
      }
      .mark {
        width: 40px;
        height: 40px;
        margin-bottom: 0.75rem;
        border-radius: 0.6rem;
        background: var(--fg);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>You are offline</h1>
      <p>
        WM Help Desk needs a connection. Tickets are never stored on this device, so there is nothing to
        show until the network is back.
      </p>
      <p>Anything you were typing is still in the tab you came from.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
